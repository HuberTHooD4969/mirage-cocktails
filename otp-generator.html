<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirage Cocktails - Admin 2FA Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-dark: #0a0a0c;
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1a1625 0%, #0a0a0c 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow spots */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(50px);
        }

        /* Glassmorphic card */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 2;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--gold);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }

        /* OTP Code Display Box */
        .otp-display-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }

        .otp-code {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            font-family: monospace;
            margin-left: 8px; /* offset character spacing */
        }

        /* Progress timer bar */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--gold);
            border-radius: 2px;
            transition: width 1s linear;
        }

        .sec-remaining {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            display: block;
        }

        .alert-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.8rem;
            color: #e5e7eb;
            line-height: 1.4;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    
    <div class="card">
        <h1>MIRAGE <span>2FA</span></h1>
        <div class="subtitle">Secure Offline OTP Generator</div>

        <div class="input-group">
            <label for="otpSecret">2FA OTP Secret Key</label>
            <input type="password" id="otpSecret" placeholder="Paste your OTP_SECRET here" autocomplete="off">
        </div>

        <div class="otp-display-box">
            <div class="otp-code" id="otpCode">------</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span class="sec-remaining" id="secRemaining">Enter secret to start</span>
        </div>

        <div class="alert-box">
            🔒 <strong>100% Client-Side:</strong> This tool runs entirely in your browser. Your secret key is calculated locally using Web Crypto and is never sent over the network.
        </div>
    </div>

    <script>
        const secretInput = document.getElementById('otpSecret');
        const otpDisplay = document.getElementById('otpCode');
        const progressBar = document.getElementById('progressBar');
        const secRemaining = document.getElementById('secRemaining');

        // Load saved secret from local storage if exists
        const savedSecret = localStorage.getItem('mirage_otp_secret') || '';
        if (savedSecret) {
            secretInput.value = savedSecret;
        }

        secretInput.addEventListener('input', () => {
            localStorage.setItem('mirage_otp_secret', secretInput.value.trim());
            updateOTP();
        });

        // Custom standard HMAC-SHA256 rolling code logic matching backend
        async function calculate2FACode(secretStr) {
            if (!secretStr) return '------';
            try {
                const timeStep = Math.floor(Date.now() / 30000).toString();
                const encoder = new TextEncoder();
                
                // Import raw secret key
                const keyData = encoder.encode(secretStr);
                const key = await window.crypto.subtle.importKey(
                    "raw",
                    keyData,
                    { name: "HMAC", hash: { name: "SHA-256" } },
                    false,
                    ["sign"]
                );
                
                // Generate HMAC signature of the timestep
                const signature = await window.crypto.subtle.sign(
                    "HMAC",
                    key,
                    encoder.encode(timeStep)
                );
                
                // Convert buffer to Hex string
                const hashArray = Array.from(new Uint8Array(signature));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                // Match backend parsing
                const hexPart = hashHex.substring(0, 8);
                const num = parseInt(hexPart, 16);
                
                return String(num % 1000000).padStart(6, '0');
            } catch (err) {
                console.error("2FA Error:", err);
                return 'ERROR';
            }
        }

        async function updateOTP() {
            const secret = secretInput.value.trim();
            if (!secret) {
                otpDisplay.textContent = '------';
                progressBar.style.width = '0%';
                secRemaining.textContent = 'Enter secret to start';
                return;
            }

            const code = await calculate2FACode(secret);
            otpDisplay.textContent = code;

            // Update timer
            const now = Date.now();
            const timeStep = Math.floor(now / 30000);
            const nextStep = (timeStep + 1) * 30000;
            const msLeft = nextStep - now;
            const secLeft = Math.ceil(msLeft / 1000);
            
            secRemaining.textContent = `Expires in ${secLeft}s`;
            
            // Progress percentage
            const pct = (msLeft / 30000) * 100;
            progressBar.style.width = `${pct}%`;
        }

        // Run updates every second
        setInterval(updateOTP, 1000);
        updateOTP();
    </script>
</body>
</html>
